name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify SUPABASE_ACCESS_TOKEN secret
        if: ${{ secrets.SUPABASE_ACCESS_TOKEN == '' }}
        run: |
          echo "::error::SUPABASE_ACCESS_TOKEN secret is missing or empty in THIS repo (my-vtu-backend)."
          echo "Add it: Settings -> Secrets and variables -> Actions -> New repository secret,"
          echo "then re-run this workflow."
          exit 1

      - name: Write secrets env file (from GitHub secrets)
        run: |
          cat > /tmp/functions.env <<'EOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BREVO_API_KEY=${{ secrets.BREVO_API_KEY }}
          SENDER_NAME=${{ secrets.SENDER_NAME }}
          SENDER_EMAIL=${{ secrets.SENDER_EMAIL }}
          BIGISUB_API_KEY=${{ secrets.BIGISUB_API_KEY }}
          BIGISUB_BASE_URL=${{ secrets.BIGISUB_BASE_URL }}
          BIGISUB_PIN=${{ secrets.BIGISUB_PIN }}
          ALRAHUZ_API_TOKEN=${{ secrets.ALRAHUZ_API_TOKEN }}
          ALRAHUZ_BASE_URL=${{ secrets.ALRAHUZ_BASE_URL }}
          ALRAHUZ_WEB_USER=${{ secrets.ALRAHUZ_WEB_USER }}
          ALRAHUZ_WEB_PASS=${{ secrets.ALRAHUZ_WEB_PASS }}
          SQUAD_SECRET_KEY=${{ secrets.SQUAD_SECRET_KEY }}
          SQUADCO_SECRET_KEY=${{ secrets.SQUADCO_SECRET_KEY }}
          SQUAD_BASE_URL=${{ secrets.SQUAD_BASE_URL }}
          SQUAD_BENEFICIARY_ACCOUNT=${{ secrets.SQUAD_BENEFICIARY_ACCOUNT }}
          RECONCILE_KEY=${{ secrets.RECONCILE_KEY }}
          EOF

      - name: Set secrets on Supabase
        # CLI 2.x: project-level secrets, applied to all functions immediately.
        # SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are auto-injected by the
        # platform, so the CLI skips them here.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set --env-file /tmp/functions.env --project-ref lraryzkamshicildghdv

      - name: Deploy functions to Supabase
        # verify_jwt flags come from supabase/config.toml (auth/vtu/wallet/reconcile = false).
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy auth vtu wallet admin reconcile squad-verify --project-ref lraryzkamshicildghdv --use-api
