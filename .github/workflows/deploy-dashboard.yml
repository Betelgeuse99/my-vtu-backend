name: Deploy Admin Dashboard (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'admin-dashboard/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: admin-dashboard
      - name: Build
        run: npm run build
        working-directory: admin-dashboard
        env:
          # Functions root — the dashboard calls /auth/* and /admin/* on it.
          # .env.production already carries the same value; this overrides it.
          VITE_API_BASE: https://lraryzkamshicildghdv.supabase.co/functions/v1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin-dashboard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
